// AudioContext for sound effects
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx2 = getAudioCtx();

    // 폭발음: 노이즈 버퍼 사용
    if (type === 'explode') {
      const len = Math.floor(ctx2.sampleRate * 0.5);
      const buffer = ctx2.createBuffer(1, len, ctx2.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = ctx2.createBufferSource();
      src.buffer = buffer;
      const filter = ctx2.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, ctx2.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, ctx2.currentTime + 0.5);
      const g = ctx2.createGain();
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.5);
      src.connect(filter); filter.connect(g); g.connect(ctx2.destination);
      src.start(); src.stop(ctx2.currentTime + 0.5);
      return;
    }

    const o = ctx2.createOscillator();
    const g = ctx2.createGain();
    const distortion = ctx2.createWaveShaper();
    
    function makeDistortionCurve(amount) {
      const k = amount, n = 256, curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = ((Math.PI + k) * x) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    o.connect(distortion);
    distortion.connect(g);
    g.connect(ctx2.destination);

    if (type === 'brick') {
      distortion.curve = makeDistortionCurve(400);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(320, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(80, ctx2.currentTime + 0.15);
      g.gain.setValueAtTime(0.9, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.18);
      o.start(); o.stop(ctx2.currentTime + 0.18);
    } else if (type === 'paddle') {
      distortion.curve = makeDistortionCurve(200);
      o.type = 'square';
      o.frequency.setValueAtTime(500, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(300, ctx2.currentTime + 0.08);
      g.gain.setValueAtTime(0.7, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.1);
      o.start(); o.stop(ctx2.currentTime + 0.1);
    } else if (type === 'wall') {
      distortion.curve = makeDistortionCurve(150);
      o.type = 'sine';
      o.frequency.setValueAtTime(400, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(250, ctx2.currentTime + 0.07);
      g.gain.setValueAtTime(0.5, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.08);
      o.start(); o.stop(ctx2.currentTime + 0.08);
    } else if (type === 'die') {
      distortion.curve = makeDistortionCurve(600);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(600, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(50, ctx2.currentTime + 0.5);
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.55);
      o.start(); o.stop(ctx2.currentTime + 0.55);
    } else if (type === 'levelup') {
      distortion.curve = makeDistortionCurve(100);
      o.type = 'sine';
      const freqs = [523, 659, 784, 1047];
      freqs.forEach((f, i) => {
        o.frequency.setValueAtTime(f, ctx2.currentTime + i * 0.1);
      });
      g.gain.setValueAtTime(0.8, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.5);
      o.start(); o.stop(ctx2.currentTime + 0.5);
    } else if (type === 'gameover') {
      distortion.curve = makeDistortionCurve(800);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(200, ctx2.currentTime);
      o.frequency.setValueAtTime(150, ctx2.currentTime + 0.2);
      o.frequency.setValueAtTime(100, ctx2.currentTime + 0.4);
      o.frequency.exponentialRampToValueAtTime(40, ctx2.currentTime + 0.8);
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.9);
      o.start(); o.stop(ctx2.currentTime + 0.9);
    } else if (type === 'gun') {
      // 기관총 발사음 (짧고 날카롭게, 자주 울리므로 볼륨 낮게)
      distortion.curve = makeDistortionCurve(300);
      o.type = 'square';
      o.frequency.setValueAtTime(900, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(150, ctx2.currentTime + 0.04);
      g.gain.setValueAtTime(0.18, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.05);
      o.start(); o.stop(ctx2.currentTime + 0.05);
    } else if (type === 'cannon') {
      // 대포 발사음 (묵직하게)
      distortion.curve = makeDistortionCurve(500);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(160, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ctx2.currentTime + 0.3);
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.35);
      o.start(); o.stop(ctx2.currentTime + 0.35);
    } else if (type === 'throw') {
      // 망치 던지는 소리 (휙)
      distortion.curve = makeDistortionCurve(20);
      o.type = 'sine';
      o.frequency.setValueAtTime(250, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(800, ctx2.currentTime + 0.12);
      g.gain.setValueAtTime(0.35, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.14);
      o.start(); o.stop(ctx2.currentTime + 0.14);
    } else if (type === 'hammer') {
      // 망치로 벽돌 치는 소리 (쾅)
      distortion.curve = makeDistortionCurve(350);
      o.type = 'square';
      o.frequency.setValueAtTime(1500, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(120, ctx2.currentTime + 0.1);
      g.gain.setValueAtTime(0.45, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.12);
      o.start(); o.stop(ctx2.currentTime + 0.12);
    } else if (type === 'item') {
      // 아이템 획득음
      distortion.curve = makeDistortionCurve(50);
      o.type = 'triangle';
      o.frequency.setValueAtTime(600, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(1400, ctx2.currentTime + 0.18);
      g.gain.setValueAtTime(0.6, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.22);
      o.start(); o.stop(ctx2.currentTime + 0.22);
    }
  } catch(e) {}
}

function brickColor(hp) { return hp > 5 ? STRONG_COLOR : colors[5 - hp]; }

function buildBricks(lv) {
  const W = canvas.width;
  const layout = LAYOUTS[(lv - 1) % LAYOUTS.length];
  const bonus = Math.floor((lv - 1) / LAYOUTS.length); // 한 바퀴 돌 때마다 체력 +1
  const bW = (W - BRICK_PAD * (BRICK_COLS + 1)) / BRICK_COLS;
  const list = [];
  layout.rows.forEach((row, r) => {
    const offset = (BRICK_COLS - row.length) / 2;
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch < '1' || ch > '9') continue;
      const hp = Math.min(9, parseInt(ch, 10) + bonus);
      list.push({
        x: BRICK_PAD + (c + offset) * (bW + BRICK_PAD),
        y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
        w: bW, h: BRICK_H,
        hp, maxHp: hp,
        color: brickColor(hp),
        alive: true
      });
    }
  });
  return list;
}

function showBanner() {
  const layout = LAYOUTS[(level - 1) % LAYOUTS.length];
  banner = { text: `레벨 ${level} · ${layout.name}`, t: 110 };
}

function drawBanner() {
  if (!banner) return;
  banner.t--;
  if (banner.t <= 0) { banner = null; return; }
  ctx.save();
  ctx.globalAlpha = Math.min(1, banner.t / 25);
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(banner.text, canvas.width / 2, canvas.height * 0.6);
  ctx.restore();
}

function initGame() {
  const W = canvas.width, H = canvas.height;
  score = 0; level = 1; lives = 3;
  updateHUD();

  const paddleW = W * 0.22;
  const paddleH = 12;
  paddle = {
    x: W / 2 - paddleW / 2,
    y: H - 50,
    w: paddleW,
    h: paddleH,
    speed: 8
  };

  const ballR = 7;
  ball = {
    x: W / 2,
    y: H - 70,
    r: ballR,
    dx: (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5),
    dy: -(3 + level * 0.5),
    trail: []
  };

  initBricks();
  particles = [];
  resetWeapons();
  shake = 0;
  showBanner();
}

function initBricks() {
  bricks = buildBricks(level);
}

function nextLevel() {
  level++;
  updateHUD();
  playSound('levelup');
  const W = canvas.width, H = canvas.height;
  ball.x = W / 2;
  ball.y = H - 70;
  ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5);
  ball.dy = -(3 + level * 0.5);
  ball.trail = [];
  // 무기는 유지하고, 화면 위 투사체/아이템만 정리
  items = [];
  bullets = [];
  shells = [];
  hammers = [];
  initBricks();
  showBanner();
}

function updateHUD() {
  scoreDisplay.textContent = score;
  levelDisplay.textContent = level;
  let h = '';
  for (let i = 0; i < lives; i++) h += '❤';
  for (let i = lives; i < 3; i++) h += '🖤';
  livesDisplay.textContent = h;
}

function spawnParticles(x, y, color, count = 18, power = 5) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * power;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

// ===== 벽돌 데미지 처리 (공/총알/포탄 공용) =====
function damageBrick(b, dmg) {
  if (!b.alive) return;
  const d = Math.min(dmg, b.hp);
  b.hp -= d;
  score += 10 * d;
  if (b.hp <= 0) {
    b.alive = false;
    score += 20;
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color[0]);
    maybeDropItem(b);
  }
  updateHUD();
}

function maybeDropItem(b) {
  if (Math.random() > ITEM_DROP_CHANCE) return;
  let rnd = Math.random(), type = ITEM_WEIGHTS[0][0];
  for (const [t, w] of ITEM_WEIGHTS) {
    if (rnd < w) { type = t; break; }
    rnd -= w;
  }
  items.push({
    x: b.x + b.w / 2,
    y: b.y + b.h / 2,
    w: 38, h: 18,
    vy: 2.2,
    type,
    t: 0
  });
}

function collectItem(type) {
  playSound('item');
  score += 50;
  updateHUD();
  if (type === 'gun') {
    weapons.gunTime = Math.min(GUN_MAX_DURATION, weapons.gunTime + GUN_DURATION);
  } else if (type === 'cannon') {
    weapons.cannonAmmo += CANNON_AMMO_PER_ITEM;
    if (weapons.cannonCooldown > 15) weapons.cannonCooldown = 15;
  } else if (type === 'hammer') {
    weapons.hammerAmmo += HAMMER_AMMO_PER_ITEM;
    if (weapons.hammerCooldown > 10) weapons.hammerCooldown = 10;
  }
  spawnParticles(paddle.x + paddle.w / 2, paddle.y, ITEM_TYPES[type].main, 12, 3);
}

function explode(x, y) {
  playSound('explode');
  shake = 14;
  explosions.push({ x, y, r: 5, maxR: CANNON_RADIUS, life: 1 });
  spawnParticles(x, y, '#ffaa33', 30, 7);
  spawnParticles(x, y, '#ff4400', 20, 5);
  for (const b of bricks) {
    if (!b.alive) continue;
    // 원과 사각형의 최단거리로 폭발 범위 판정
    const cx = Math.max(b.x, Math.min(x, b.x + b.w));
    const cy = Math.max(b.y, Math.min(y, b.y + b.h));
    if (Math.hypot(x - cx, y - cy) <= CANNON_RADIUS) {
      damageBrick(b, CANNON_DAMAGE);
    }
  }
}

function rectHitsBrick(x, y, w, h) {
  for (const b of bricks) {
    if (!b.alive) continue;
    if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return b;
  }
  return null;
}

function updateWeapons() {
  const W = canvas.width;

  // 기관총: 패들 양 끝에서 번갈아 자동 연사
  if (weapons.gunTime > 0) {
    weapons.gunTime--;
    weapons.gunCooldown--;
    if (weapons.gunCooldown <= 0) {
      weapons.gunCooldown = GUN_FIRE_INTERVAL;
      weapons.gunSide ^= 1;
      const bx = weapons.gunSide ? paddle.x + 6 : paddle.x + paddle.w - 6;
      bullets.push({ x: bx - 1.5, y: paddle.y - 10, w: 3, h: 10, vy: -11 });
      playSound('gun');
    }
  }

  // 대포: 일정 간격으로 패들 중앙에서 폭발탄 발사
  if (weapons.cannonAmmo > 0) {
    weapons.cannonCooldown--;
    if (weapons.cannonCooldown <= 0) {
      weapons.cannonCooldown = CANNON_FIRE_INTERVAL;
      weapons.cannonAmmo--;
      shells.push({ x: paddle.x + paddle.w / 2, y: paddle.y - 14, r: 7, vy: -6.5 });
      playSound('cannon');
      shake = Math.max(shake, 5);
      spawnParticles(paddle.x + paddle.w / 2, paddle.y - 14, '#dddddd', 8, 2);
    }
  }

  // 총알 이동 및 충돌
  bullets = bullets.filter(bl => {
    bl.y += bl.vy;
    if (bl.y + bl.h < 0) return false;
    const hit = rectHitsBrick(bl.x, bl.y, bl.w, bl.h);
    if (hit) {
      damageBrick(hit, 1);
      spawnParticles(bl.x, bl.y, '#ffee88', 4, 2);
      return false;
    }
    return true;
  });

  // 포탄 이동 및 충돌
  shells = shells.filter(s => {
    s.y += s.vy;
    if (Math.random() < 0.8) {
      particles.push({ x: s.x + (Math.random() - 0.5) * 4, y: s.y + s.r, vx: (Math.random() - 0.5), vy: 1 + Math.random(), life: 0.7, color: '#ff8833', size: 2 + Math.random() * 2 });
    }
    if (s.y - s.r <= 0) { explode(s.x, Math.max(s.y, s.r)); return false; }
    const hit = rectHitsBrick(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    if (hit) { explode(s.x, s.y); return false; }
    return true;
  });

  // 망치: 포물선으로 던지고, 닿는 벽돌을 모두 관통하며 타격
  if (weapons.hammerAmmo > 0) {
    weapons.hammerCooldown--;
    if (weapons.hammerCooldown <= 0) {
      weapons.hammerCooldown = HAMMER_FIRE_INTERVAL;
      weapons.hammerAmmo--;
      const reach = Math.max(120, paddle.y - BRICK_TOP);  // 벽돌 맨 윗줄까지 닿는 높이
      hammers.push({
        x: paddle.x + paddle.w / 2,
        y: paddle.y - 12,
        r: 11,
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 2.2),
        vy: -Math.sqrt(2 * HAMMER_GRAVITY * reach),
        angle: 0,
        falling: false,
        hit: new Set()
      });
      playSound('throw');
    }
  }

  hammers = hammers.filter(hm => {
    hm.vy += HAMMER_GRAVITY;
    hm.x += hm.vx;
    hm.y += hm.vy;
    hm.angle += 0.35 * (hm.vx >= 0 ? 1 : -1);
    if (hm.x - hm.r < 0) { hm.x = hm.r; hm.vx = Math.abs(hm.vx); }
    if (hm.x + hm.r > W) { hm.x = W - hm.r; hm.vx = -Math.abs(hm.vx); }
    if (hm.y - hm.r < 0) { hm.y = hm.r; hm.vy = Math.abs(hm.vy) * 0.5; }

    // 내려오기 시작하면 같은 벽돌을 한 번 더 칠 수 있음
    if (hm.vy > 0 && !hm.falling) { hm.falling = true; hm.hit.clear(); }

    for (const b of bricks) {
      if (!b.alive || hm.hit.has(b)) continue;
      const cx = Math.max(b.x, Math.min(hm.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(hm.y, b.y + b.h));
      if (Math.hypot(hm.x - cx, hm.y - cy) <= hm.r) {
        hm.hit.add(b);
        damageBrick(b, HAMMER_DAMAGE);
        spawnParticles(cx, cy, '#ffcc66', 6, 3);
        shake = Math.max(shake, 3);
        playSound('hammer');
      }
    }

    // 떨어지는 망치를 패들로 받으면 1개 회수
    if (
      hm.vy > 0 &&
      hm.y + hm.r >= paddle.y &&
      hm.y - hm.r <= paddle.y + paddle.h &&
      hm.x >= paddle.x - 4 &&
      hm.x <= paddle.x + paddle.w + 4
    ) {
      weapons.hammerAmmo++;
      playSound('item');
      return false;
    }
    return hm.y - hm.r < canvas.height;
  });

  // 폭발 이펙트
  explosions = explosions.filter(e => {
    e.r += (e.maxR - e.r) * 0.25;
    e.life -= 0.05;
    return e.life > 0;
  });

  // 떨어지는 아이템
  items = items.filter(it => {
    it.y += it.vy;
    it.t++;
    if (
      it.y + it.h / 2 >= paddle.y &&
      it.y - it.h / 2 <= paddle.y + paddle.h &&
      it.x + it.w / 2 >= paddle.x &&
      it.x - it.w / 2 <= paddle.x + paddle.w
    ) {
      collectItem(it.type);
      return false;
    }
    return it.y - it.h / 2 < canvas.height;
  });

  if (shake > 0) { shake *= 0.85; if (shake < 0.5) shake = 0; }
}

function drawGlowRect(x, y, w, h, color, glow) {
  ctx.save();
  ctx.shadowColor = glow;
  ctx.shadowBlur = 15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.restore();
}

function drawBrick(brick) {
  const ratio = brick.hp / brick.maxHp;
  const [main, light, dark] = brick.color;
  
  ctx.save();
  ctx.shadowColor = main;
  ctx.shadowBlur = 10 * ratio;
  
  const gradient = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
  gradient.addColorStop(0, light);
  gradient.addColorStop(0.5, main);
  gradient.addColorStop(1, dark);
  ctx.fillStyle = gradient;
  
  ctx.globalAlpha = 0.4 + 0.6 * ratio;
  ctx.beginPath();
  ctx.roundRect(brick.x, brick.y, brick.w, brick.h, 3);
  ctx.fill();
  
  if (brick.hp > 1) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `bold ${Math.max(9, brick.h * 0.65)}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(brick.hp, brick.x + brick.w / 2, brick.y + brick.h / 2);
  }
  ctx.restore();
}

function drawPaddle() {
  // 기관총 총신 (패들 양 끝)
  if (weapons.gunTime > 0) {
    const blink = weapons.gunTime < 120 && Math.floor(weapons.gunTime / 8) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.4 : 1;
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(paddle.x + 3, paddle.y - 9, 6, 11);
    ctx.fillRect(paddle.x + paddle.w - 9, paddle.y - 9, 6, 11);
    ctx.fillStyle = '#ffccd5';
    ctx.fillRect(paddle.x + 4.5, paddle.y - 11, 3, 3);
    ctx.fillRect(paddle.x + paddle.w - 7.5, paddle.y - 11, 3, 3);
    ctx.restore();
  }
  // 대포 포신 (패들 중앙)
  if (weapons.cannonAmmo > 0) {
    const cx = paddle.x + paddle.w / 2;
    const recoil = weapons.cannonCooldown > CANNON_FIRE_INTERVAL - 6 ? 4 : 0;
    ctx.save();
    ctx.shadowColor = '#9955ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#6633cc';
    ctx.beginPath();
    ctx.arc(cx, paddle.y, 10, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#9955ff';
    ctx.beginPath();
    ctx.roundRect(cx - 5, paddle.y - 20 + recoil, 10, 16, 2);
    ctx.fill();
    ctx.restore();
  }

  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
  grad.addColorStop(0, '#00ffff');
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, '#00ffff');
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
  ctx.restore();
}

function drawBall() {
  // Trail
  ball.trail.forEach((t, i) => {
    const alpha = (i / ball.trail.length) * 0.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * (i / ball.trail.length), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  ctx.save();
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 25;
  const grad = ctx.createRadialGradient(
    ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.1,
    ball.x, ball.y, ball.r
  );
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.5, '#88ddff');
  grad.addColorStop(1, '#00aaff');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, p.size * p.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawItems() {
  items.forEach(it => {
    const info = ITEM_TYPES[it.type];
    const pulse = 0.7 + 0.3 * Math.sin(it.t * 0.2);
    ctx.save();
    ctx.shadowColor = info.main;
    ctx.shadowBlur = 15 * pulse;
    const g = ctx.createLinearGradient(0, it.y - it.h / 2, 0, it.y + it.h / 2);
    g.addColorStop(0, info.light);
    g.addColorStop(1, info.main);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(it.x - it.w / 2, it.y - it.h / 2, it.w, it.h, it.h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(info.label, it.x, it.y + 1);
    ctx.restore();
  });
}

// 망치 모양 그리기 (x, y 중심 / angle 회전)
function drawHammerShape(x, y, angle, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.shadowColor = '#ffaa33';
  ctx.shadowBlur = 10;
  // 손잡이
  ctx.fillStyle = '#b5652b';
  ctx.beginPath();
  ctx.roundRect(-2, -3, 4, 16, 2);
  ctx.fill();
  // 머리
  const g = ctx.createLinearGradient(0, -11, 0, -2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#8899aa');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(-9, -11, 18, 9, 2);
  ctx.fill();
  ctx.restore();
}

function drawProjectiles() {
  // 총알
  ctx.save();
  ctx.shadowColor = '#ffee55';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#fff6aa';
  bullets.forEach(bl => ctx.fillRect(bl.x, bl.y, bl.w, bl.h));
  ctx.restore();

  // 포탄
  shells.forEach(s => {
    ctx.save();
    ctx.shadowColor = '#ff8800';
    ctx.shadowBlur = 18;
    const g = ctx.createRadialGradient(s.x - 2, s.y - 2, 1, s.x, s.y, s.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, '#ffbb55');
    g.addColorStop(1, '#cc3300');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 망치
  hammers.forEach(hm => drawHammerShape(hm.x, hm.y, hm.angle));

  // 폭발
  explosions.forEach(e => {
    ctx.save();
    ctx.globalAlpha = e.life * 0.5;
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    g.addColorStop(0, '#ffffcc');
    g.addColorStop(0.5, '#ff9933');
    g.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = e.life;
    ctx.strokeStyle = '#ffcc66';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

// 캔버스 상단에 무기 상태 표시
function drawWeaponStatus() {
  let x = 8;
  const y = 19;
  ctx.save();
  ctx.font = 'bold 12px Arial';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  if (weapons.gunTime > 0) {
    ctx.fillStyle = '#ff5577';
    ctx.fillText('기관총', x, y);
    const barX = x + 42, barW = 56;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(barX, y - 5, barW, 10);
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(barX, y - 5, barW * Math.min(1, weapons.gunTime / GUN_MAX_DURATION), 10);
    x = barX + barW + 12;
  }
  if (weapons.cannonAmmo > 0) {
    ctx.fillStyle = '#bb88ff';
    ctx.fillText('대포', x, y);
    const shown = Math.min(weapons.cannonAmmo, 5);
    for (let i = 0; i < shown; i++) {
      ctx.beginPath();
      ctx.arc(x + 32 + i * 11, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    x += 32 + shown * 11;
    if (weapons.cannonAmmo > 5) {
      ctx.fillText(`+${weapons.cannonAmmo - 5}`, x - 2, y);
      x += 22;
    }
    x += 8;
  }
  if (weapons.hammerAmmo > 0) {
    drawHammerShape(x + 8, y + 1, -0.6, 0.8);
    ctx.fillStyle = '#ffaa33';
    ctx.fillText(`x${weapons.hammerAmmo}`, x + 20, y);
  }
  ctx.restore();
}

function update() {
  const W = canvas.width, H = canvas.height;

  // Ball trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 10) ball.trail.shift();

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall collisions
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); playSound('wall'); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); playSound('wall'); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); playSound('wall'); }

  // Ball fell
  if (ball.y + ball.r > H + 20) {
    playSound('die');
    lives--;
    updateHUD();
    if (lives <= 0) {
      gameOver();
      return;
    }
    ball.x = W / 2;
    ball.y = H - 70;
    ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5);
    ball.dy = -(3 + level * 0.5);
    ball.trail = [];
    resetWeapons(); // 목숨을 잃으면 무기도 사라짐
  }

  // Paddle collision
  if (
    ball.y + ball.r >= paddle.y &&
    ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.dy) &&
    ball.x >= paddle.x - ball.r &&
    ball.x <= paddle.x + paddle.w + ball.r &&
    ball.dy > 0
  ) {
    const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    ball.dx = hitPos * (5 + level * 0.4);
    ball.dy = -Math.abs(ball.dy);
    ball.y = paddle.y - ball.r;
    playSound('paddle');
  }

  // Brick collisions (ball)
  for (let b of bricks) {
    if (!b.alive) continue;
    if (
      ball.x + ball.r > b.x &&
      ball.x - ball.r < b.x + b.w &&
      ball.y + ball.r > b.y &&
      ball.y - ball.r < b.y + b.h
    ) {
      const overlapLeft = ball.x + ball.r - b.x;
      const overlapRight = b.x + b.w - (ball.x - ball.r);
      const overlapTop = ball.y + ball.r - b.y;
      const overlapBottom = b.y + b.h - (ball.y - ball.r);
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.dx *= -1;
      else ball.dy *= -1;

      damageBrick(b, 1);
      playSound('brick');
      break;
    }
  }

  // 무기 / 아이템
  updateWeapons();

  // 모든 벽돌 파괴 시 다음 레벨 (총알·포탄으로 깨도 적용)
  if (bricks.every(b => !b.alive)) {
    nextLevel();
  }

  // Particles
  particles = particles.filter(p => p.life > 0.01);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.03;
    p.vx *= 0.97;
  });
}

function drawBackground() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
  
  // Stars
  for (let i = 0; i < 30; i++) {
    const x = (i * 137.5 + 50) % canvas.width;
    const y = (i * 97.3 + 30) % canvas.height;
    const alpha = 0.1 + 0.1 * Math.sin(Date.now() * 0.001 + i);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function gameLoop() {
  if (!gameRunning) return;
  update();
  if (!gameRunning) return;

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();
  bricks.forEach(b => { if (b.alive) drawBrick(b); });
  drawItems();
  drawProjectiles();
  drawPaddle();
  drawBall();
  drawParticles();
  ctx.restore();

  drawWeaponStatus();
  drawBanner();
  animId = requestAnimationFrame(gameLoop);
}

function startGame() {
  overlay.style.display = 'none';
  gameRunning = true;
  initGame();
  gameLoop();
}

async function gameOver() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  playSound('gameover');

  // Save score
  try {
    await db.collection("apps/app-mufb6frx/items").add({
      score: score,
      level: level,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {}

  finalScore.style.display = 'block';
  finalScore.textContent = `점수: ${score}`;
  bestScoreText.style.display = 'block';
  bestScoreText.textContent = `도달 레벨: ${level}`;
  startBtn.textContent = '다시 시작';
  overlay.style.display = 'flex';
}

// Touch controls
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  paddleStartX = paddle ? paddle.x : 0;
  if (!gameRunning) return;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!gameRunning || !paddle) return;
  const dx = e.touches[0].clientX - touchStartX;
  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddleStartX + dx));
}, { passive: false });

// Mouse controls
canvas.addEventListener('mousemove', e => {
  if (!gameRunning || !paddle) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mx - paddle.w / 2));
});

startBtn.addEventListener('click', startGame);

// Load leaderboard
function loadLeaderboard() {
  db.collection("apps/app-mufb6frx/items")
    .orderBy("score", "desc")
    .limit(10)
    .onSnapshot(snap => {
      rankList.innerHTML = '';
      // QuerySnapshot.forEach는 인덱스를 넘겨주지 않으므로 snap.docs 사용
      snap.docs.forEach((doc, i) => {
        const d = doc.data();
        const li = document.createElement('li');
        const medals = ['🥇','🥈','🥉'];
        const rankIcon = medals[i] || `${i+1}.`;
        li.innerHTML = `<span class="rank-num">${rankIcon}</span><span>Lv.${Number(d.level) || 1}</span><span class="rank-score">${Number(d.score) || 0}점</span>`;
        rankList.appendChild(li);
      });
    });
}

// Initial draw
function drawInitial() {
  drawBackground();
  buildBricks(1).forEach(drawBrick);
}
drawInitial();
loadLeaderboard();

window.addEventListener('resize', () => {
  setCanvasSize();
  if (!gameRunning) drawInitial();
});
</script>
</body>
</html>
