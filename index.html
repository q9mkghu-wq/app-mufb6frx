<script>
const firebaseConfig = {"apiKey":"AIzaSyAA9XxN-Pw0vbLT0f8-mI2bV0FgEx18iIU","authDomain":"appbuilder-4e83c.firebaseapp.com","projectId":"appbuilder-4e83c","storageBucket":"appbuilder-4e83c.firebasestorage.app","messagingSenderId":"1038242551917","appId":"1:1038242551917:web:4d59995638762401dd0764"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const levelDisplay = document.getElementById('levelDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const finalScore = document.getElementById('finalScore');
const bestScoreText = document.getElementById('bestScoreText');
const rankList = document.getElementById('rankList');

// Canvas size
const gameContainer = document.getElementById('gameContainer');
const leaderboardEl = document.getElementById('leaderboard');

// 게임 모드: 'normal' = 일반(세로), 'wide' = 와이드(컴퓨터/TV), 'goblin' = 도깨비
function loadMode() {
  try {
    const m = localStorage.getItem('brickMode');
    if (m === 'pc' || m === 'wide') return 'wide';
    if (m === 'mobile' || m === 'normal') return 'normal';
    if (m === 'goblin') return 'goblin';
  } catch (e) {}
  return window.innerWidth >= 900 ? 'wide' : 'normal'; // 저장된 값이 없으면 화면 폭으로 자동 선택
}
let gameMode = loadMode();
// 도깨비 모드는 기기 화면에 맞춰 자동으로 일반/와이드 화면을 사용
function isWideScreen() {
  return gameMode === 'wide' || (gameMode === 'goblin' && window.innerWidth >= 900);
}
let pcMode = isWideScreen();
let S = 1; // 화면 크기에 따른 속도 배율
const PC_SPEED_BOOST = 1.35; // 컴퓨터/TV 모드 추가 속도 (빠르게 하려면 숫자를 키우세요)

function setCanvasSize() {
  if (pcMode) {
    canvas.width = Math.max(600, window.innerWidth - 8);
    canvas.height = Math.max(400, window.innerHeight - 72);
  } else {
    canvas.width = Math.min(window.innerWidth, 420);
    canvas.height = Math.min(window.innerHeight - 180, 600);
  }
  S = pcMode ? Math.min(2.6, Math.max(1, canvas.height / 600) * PC_SPEED_BOOST) : 1;
}
setCanvasSize();

// AudioContext for sound effects
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx2 = getAudioCtx();

    // 폭발음: 노이즈 버퍼 사용
    if (type === 'explode') {
      const len = Math.floor(ctx2.sampleRate * 0.5);
      const buffer = ctx2.createBuffer(1, len, ctx2.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = ctx2.createBufferSource();
      src.buffer = buffer;
      const filter = ctx2.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, ctx2.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, ctx2.currentTime + 0.5);
      const g = ctx2.createGain();
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.5);
      src.connect(filter); filter.connect(g); g.connect(ctx2.destination);
      src.start(); src.stop(ctx2.currentTime + 0.5);
      return;
    }

    const o = ctx2.createOscillator();
    const g = ctx2.createGain();
    const distortion = ctx2.createWaveShaper();
    
    function makeDistortionCurve(amount) {
      const k = amount, n = 256, curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = ((Math.PI + k) * x) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    o.connect(distortion);
    distortion.connect(g);
    g.connect(ctx2.destination);

    if (type === 'brick') {
      distortion.curve = makeDistortionCurve(400);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(320, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(80, ctx2.currentTime + 0.15);
      g.gain.setValueAtTime(0.9, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.18);
      o.start(); o.stop(ctx2.currentTime + 0.18);
    } else if (type === 'paddle') {
      distortion.curve = makeDistortionCurve(200);
      o.type = 'square';
      o.frequency.setValueAtTime(500, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(300, ctx2.currentTime + 0.08);
      g.gain.setValueAtTime(0.7, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.1);
      o.start(); o.stop(ctx2.currentTime + 0.1);
    } else if (type === 'wall') {
      distortion.curve = makeDistortionCurve(150);
      o.type = 'sine';
      o.frequency.setValueAtTime(400, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(250, ctx2.currentTime + 0.07);
      g.gain.setValueAtTime(0.5, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.08);
      o.start(); o.stop(ctx2.currentTime + 0.08);
    } else if (type === 'die') {
      distortion.curve = makeDistortionCurve(600);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(600, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(50, ctx2.currentTime + 0.5);
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.55);
      o.start(); o.stop(ctx2.currentTime + 0.55);
    } else if (type === 'levelup') {
      distortion.curve = makeDistortionCurve(100);
      o.type = 'sine';
      const freqs = [523, 659, 784, 1047];
      freqs.forEach((f, i) => {
        o.frequency.setValueAtTime(f, ctx2.currentTime + i * 0.1);
      });
      g.gain.setValueAtTime(0.8, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.5);
      o.start(); o.stop(ctx2.currentTime + 0.5);
    } else if (type === 'gameover') {
      distortion.curve = makeDistortionCurve(800);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(200, ctx2.currentTime);
      o.frequency.setValueAtTime(150, ctx2.currentTime + 0.2);
      o.frequency.setValueAtTime(100, ctx2.currentTime + 0.4);
      o.frequency.exponentialRampToValueAtTime(40, ctx2.currentTime + 0.8);
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.9);
      o.start(); o.stop(ctx2.currentTime + 0.9);
    } else if (type === 'gun') {
      // 기관총 발사음 (짧고 날카롭게, 자주 울리므로 볼륨 낮게)
      distortion.curve = makeDistortionCurve(300);
      o.type = 'square';
      o.frequency.setValueAtTime(900, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(150, ctx2.currentTime + 0.04);
      g.gain.setValueAtTime(0.18, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.05);
      o.start(); o.stop(ctx2.currentTime + 0.05);
    } else if (type === 'cannon') {
      // 대포 발사음 (묵직하게)
      distortion.curve = makeDistortionCurve(500);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(160, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ctx2.currentTime + 0.3);
      g.gain.setValueAtTime(1.0, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.35);
      o.start(); o.stop(ctx2.currentTime + 0.35);
    } else if (type === 'throw') {
      // 망치 던지는 소리 (휙)
      distortion.curve = makeDistortionCurve(20);
      o.type = 'sine';
      o.frequency.setValueAtTime(250, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(800, ctx2.currentTime + 0.12);
      g.gain.setValueAtTime(0.35, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.14);
      o.start(); o.stop(ctx2.currentTime + 0.14);
    } else if (type === 'hammer') {
      // 망치로 벽돌 치는 소리 (쾅)
      distortion.curve = makeDistortionCurve(350);
      o.type = 'square';
      o.frequency.setValueAtTime(1500, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(120, ctx2.currentTime + 0.1);
      g.gain.setValueAtTime(0.45, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.12);
      o.start(); o.stop(ctx2.currentTime + 0.12);
    } else if (type === 'goblin') {
      // 도깨비 웃음 (히히히)
      distortion.curve = makeDistortionCurve(30);
      o.type = 'triangle';
      for (let i = 0; i < 6; i++) o.frequency.setValueAtTime(i % 2 ? 520 : 720, ctx2.currentTime + i * 0.07);
      g.gain.setValueAtTime(0.35, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.45);
      o.start(); o.stop(ctx2.currentTime + 0.45);
    } else if (type === 'goblinHit') {
      distortion.curve = makeDistortionCurve(200);
      o.type = 'square';
      o.frequency.setValueAtTime(420, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(180, ctx2.currentTime + 0.1);
      g.gain.setValueAtTime(0.4, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.12);
      o.start(); o.stop(ctx2.currentTime + 0.12);
    } else if (type === 'goblinDie') {
      distortion.curve = makeDistortionCurve(400);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(800, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, ctx2.currentTime + 0.6);
      g.gain.setValueAtTime(0.8, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.65);
      o.start(); o.stop(ctx2.currentTime + 0.65);
    } else if (type === 'fire') {
      distortion.curve = makeDistortionCurve(20);
      o.type = 'sine';
      o.frequency.setValueAtTime(900, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(300, ctx2.currentTime + 0.25);
      g.gain.setValueAtTime(0.3, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.28);
      o.start(); o.stop(ctx2.currentTime + 0.28);
    } else if (type === 'freeze') {
      distortion.curve = makeDistortionCurve(20);
      o.type = 'triangle';
      o.frequency.setValueAtTime(1500, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(2600, ctx2.currentTime + 0.2);
      g.gain.setValueAtTime(0.4, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.25);
      o.start(); o.stop(ctx2.currentTime + 0.25);
    } else if (type === 'item') {
      // 아이템 획득음
      distortion.curve = makeDistortionCurve(50);
      o.type = 'triangle';
      o.frequency.setValueAtTime(600, ctx2.currentTime);
      o.frequency.exponentialRampToValueAtTime(1400, ctx2.currentTime + 0.18);
      g.gain.setValueAtTime(0.6, ctx2.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.22);
      o.start(); o.stop(ctx2.currentTime + 0.22);
    }
  } catch(e) {}
}

// Game state
let score = 0, level = 1, lives = 3, gameRunning = false;
let paddle, ball, bricks, particles;
let animId;
let touchStartX = 0, paddleStartX = 0;

// ===== 무기 / 아이템 상태 =====
const ITEM_DROP_CHANCE = 0.07;    // 벽돌 파괴 시 아이템 드랍 확률

function brickHeightFor(bW) {
  return pcMode ? Math.max(14, Math.min(24, Math.round(bW * 0.55))) : BRICK_H;
}

// 레벨 배치를 화면에 맞게 펼침. 컴퓨터 모드에서는 가로로 여러 번 반복해 화면을 가득 채움
function layoutGrid(lv) {
  const layout = LAYOUTS[(lv - 1) % LAYOUTS.length];
  if (!pcMode) return { rows: layout.rows, cols: BRICK_COLS };

  const W = canvas.width, H = canvas.height;
  const tiles = Math.max(2, Math.round(W / 380));   // 가로 반복 횟수
  const cols = tiles * BRICK_COLS;
  const bW = (W - BRICK_PAD * (cols + 1)) / cols;
  const bH = brickHeightFor(bW);
  const base = layout.rows.map(r => {
    const pad = BRICK_COLS - r.length;
    const left = Math.floor(pad / 2);
    return '.'.repeat(left) + r + '.'.repeat(pad - left);
  });
  // 화면 위쪽 절반 안에서 세로로도 반복
  const areaRows = Math.floor((H * 0.5) / (bH + BRICK_PAD));
  const vTiles = Math.max(1, Math.min(3, Math.floor((areaRows + 1) / (base.length + 1))));
  const rows = [];
  for (let v = 0; v < vTiles; v++) {
    if (v > 0) rows.push('.'.repeat(cols));
    base.forEach(r => rows.push(r.repeat(tiles)));
  }
  return { rows, cols };
}

function makeBrick(ch, bonus) {
  if (ch >= '1' && ch <= '9') {
    const hp = Math.min(9, parseInt(ch, 10) + bonus);
    return { kind: 'normal', hp, maxHp: hp, color: brickColor(hp), alive: true };
  }
  if (ch === 'S') {
    const hp = STEEL_HP + bonus * 2;
    return { kind: 'steel', hp, maxHp: hp, color: ['#c8d0d8','#ffffff','#6a7480'], alive: true };
  }
  if (ch === 'R') {
    const hp = REGEN_HP + bonus;
    return { kind: 'regen', hp, maxHp: hp, color: ['#22dd88','#99ffcc','#008844'], alive: true, regen: 0 };
  }
  if (ch === '#') {
    return { kind: 'wall', hp: Infinity, maxHp: Infinity, color: ['#555a66','#7a8090','#2a2e36'], alive: true };
  }
  return null;
}

function buildBricks(lv) {
  const W = canvas.width;
  const { rows, cols } = layoutGrid(lv);
  const bonus = Math.floor((lv - 1) / LAYOUTS.length); // 한 바퀴 돌 때마다 체력 증가
  const bW = (W - BRICK_PAD * (cols + 1)) / cols;
  const bH = brickHeightFor(bW);
  const list = [];
  rows.forEach((row, r) => {
    const offset = (cols - row.length) / 2;
    for (let c = 0; c < row.length; c++) {
      const b = makeBrick(row[c], bonus);
      if (!b) continue;
      b.x = BRICK_PAD + (c + offset) * (bW + BRICK_PAD);
      b.y = BRICK_TOP + r * (bH + BRICK_PAD);
      b.w = bW;
      b.h = bH;
      list.push(b);
    }
  });
  return list;
}

function showBanner() {
  const layout = LAYOUTS[(level - 1) % LAYOUTS.length];
  const gob = gameMode === 'goblin' ? ` · 👹×${goblinCount()}` : '';
  banner = { text: `레벨 ${level} · ${layout.name}${gob}`, t: 110 };
}

function drawBanner() {
  if (!banner) return;
  banner.t--;
  if (banner.t <= 0) { banner = null; return; }
  ctx.save();
  ctx.globalAlpha = Math.min(1, banner.t / 25);
  ctx.font = `bold ${Math.round(22 * S)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(banner.text, canvas.width / 2, canvas.height * 0.6);
  ctx.restore();
}

function initGame() {
  const W = canvas.width, H = canvas.height;
  score = 0; level = 1; lives = 3;
  updateHUD();

  const paddleW = pcMode ? Math.max(120, Math.min(260, W * 0.12)) : W * 0.22;
  const paddleH = pcMode ? 16 : 12;
  paddle = {
    x: W / 2 - paddleW / 2,
    y: H - 50,
    w: paddleW,
    h: paddleH,
    speed: 8,
    stun: 0
  };

  const ballR = pcMode ? 9 : 7;
  ball = {
    x: W / 2,
    y: H - 70,
    r: ballR,
    dx: (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5) * S,
    dy: -(3 + level * 0.5) * S,
    trail: []
  };

  initBricks();
  particles = [];
  resetWeapons();
  shake = 0;
  spawnGoblins();
  showBanner();
}

function initBricks() {
  bricks = buildBricks(level);
  bricksDirty = true;
}

function nextLevel() {
  level++;
  updateHUD();
  playSound('levelup');
  const W = canvas.width, H = canvas.height;
  ball.x = W / 2;
  ball.y = H - 70;
  ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5) * S;
  ball.dy = -(3 + level * 0.5) * S;
  ball.trail = [];
  // 무기는 유지하고, 화면 위 투사체/아이템만 정리
  items = [];
  bullets = [];
  shells = [];
  hammers = [];
  initBricks();
  spawnGoblins();
  showBanner();
}

function updateHUD() {
  scoreDisplay.textContent = score;
  levelDisplay.textContent = level;
  let h = '';
  for (let i = 0; i < lives; i++) h += '❤';
  for (let i = lives; i < 3; i++) h += '🖤';
  livesDisplay.textContent = h;
}

function spawnParticles(x, y, color, count = 18, power = 5) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * power;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

// ===== 벽돌 데미지 처리 (공/총알/포탄/망치 공용) =====
// source: 'ball' | 'bullet' | 'cannon' | 'hammer'
// 실제로 데미지가 들어갔으면 true
function damageBrick(b, dmg, source = 'ball') {
  if (!b.alive) return false;
  bricksDirty = true;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  if (b.kind === 'wall') {
    spawnParticles(cx, cy, '#ffffff', 3, 1.5);
    return false;
  }
  if (b.kind === 'steel' && source === 'bullet') {
    spawnParticles(cx, b.y + b.h, '#ffffff', 3, 2); // 총알이 튕겨 나감
    return false;
  }
  const d = Math.min(dmg, b.hp);
  b.hp -= d;
  if (b.kind === 'regen') b.regen = 0;
  score += 10 * d;
  if (b.hp <= 0) {
    b.alive = false;
    score += b.kind === 'steel' ? 150 : b.kind === 'regen' ? 80 : 20;
    spawnParticles(cx, cy, b.color[0], b.kind === 'normal' ? 18 : 32, b.kind === 'normal' ? 5 : 7);
    if (b.kind === 'steel') shake = Math.max(shake, 6);
    maybeDropItem(b, b.kind === 'steel' ? STEEL_DROP_CHANCE : ITEM_DROP_CHANCE);
  }
  updateHUD();
  return true;
}

function maybeDropItem(b, chance = ITEM_DROP_CHANCE) {
  if (items.length >= MAX_FALLING_ITEMS || itemCooldown > 0) return;
  if (Math.random() > chance) return;
  itemCooldown = ITEM_COOLDOWN;
  let rnd = Math.random(), type = ITEM_WEIGHTS[0][0];
  for (const [t, w] of ITEM_WEIGHTS) {
    if (rnd < w) { type = t; break; }
    rnd -= w;
  }
  items.push({
    x: b.x + b.w / 2,
    y: b.y + b.h / 2,
    w: 38, h: 18,
    vy: 2.2 * S,
    type,
    t: 0
  });
}

function collectItem(type) {
  playSound('item');
  score += 50;
  updateHUD();
  if (type === 'gun') {
    weapons.gunTime = Math.min(GUN_MAX_DURATION, weapons.gunTime + GUN_DURATION);
  } else if (type === 'cannon') {
    weapons.cannonAmmo += CANNON_AMMO_PER_ITEM;
    if (weapons.cannonCooldown > 15) weapons.cannonCooldown = 15;
  } else if (type === 'hammer') {
    weapons.hammerAmmo += HAMMER_AMMO_PER_ITEM;
    if (weapons.hammerCooldown > 10) weapons.hammerCooldown = 10;
  }
  spawnParticles(paddle.x + paddle.w / 2, paddle.y, ITEM_TYPES[type].main, 12, 3);
}

function explode(x, y) {
  playSound('explode');
  shake = 14;
  explosions.push({ x, y, r: 5, maxR: CANNON_RADIUS * S, life: 1 });
  spawnParticles(x, y, '#ffaa33', 30, 7);
  spawnParticles(x, y, '#ff4400', 20, 5);
  for (const b of bricks) {
    if (!b.alive) continue;
    // 원과 사각형의 최단거리로 폭발 범위 판정
    const cx = Math.max(b.x, Math.min(x, b.x + b.w));
    const cy = Math.max(b.y, Math.min(y, b.y + b.h));
    if (Math.hypot(x - cx, y - cy) <= CANNON_RADIUS * S) {
      damageBrick(b, CANNON_DAMAGE, 'cannon');
    }
  }
  for (const g of goblins) {
    if (g.dead) continue;
    const cx = Math.max(g.x, Math.min(x, g.x + g.w));
    const cy = Math.max(g.y, Math.min(y, g.y + g.h));
    if (Math.hypot(x - cx, y - cy) <= CANNON_RADIUS * S) hurtGoblin(g, CANNON_DAMAGE);
  }
}

function rectHitsBrick(x, y, w, h) {
  for (const b of bricks) {
    if (!b.alive) continue;
    if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return b;
  }
  return null;
}

function updateWeapons() {
  const W = canvas.width;

  // 기관총: 패들 양 끝에서 번갈아 자동 연사
  if (weapons.gunTime > 0) {
    weapons.gunTime--;
    weapons.gunCooldown--;
    if (weapons.gunCooldown <= 0) {
      weapons.gunCooldown = GUN_FIRE_INTERVAL;
      weapons.gunSide ^= 1;
      const bx = weapons.gunSide ? paddle.x + 6 : paddle.x + paddle.w - 6;
      bullets.push({ x: bx - 1.5, y: paddle.y - 10, w: 3, h: 10, vy: -11 * S });
      playSound('gun');
    }
  }

  // 대포: 일정 간격으로 패들 중앙에서 폭발탄 발사
  if (weapons.cannonAmmo > 0) {
    weapons.cannonCooldown--;
    if (weapons.cannonCooldown <= 0) {
      weapons.cannonCooldown = CANNON_FIRE_INTERVAL;
      weapons.cannonAmmo--;
      shells.push({ x: paddle.x + paddle.w / 2, y: paddle.y - 14, r: 7, vy: -6.5 * S });
      playSound('cannon');
      shake = Math.max(shake, 5);
      spawnParticles(paddle.x + paddle.w / 2, paddle.y - 14, '#dddddd', 8, 2);
    }
  }

  // 총알 이동 및 충돌
  bullets = bullets.filter(bl => {
    bl.y += bl.vy;
    if (bl.y + bl.h < 0) return false;
    const gh = goblinInRect(bl.x, bl.y, bl.w, bl.h);
    if (gh) { hurtGoblin(gh, 1); return false; }
    const hit = rectHitsBrick(bl.x, bl.y, bl.w, bl.h);
    if (hit) {
      damageBrick(hit, 1, 'bullet');
      spawnParticles(bl.x, bl.y, '#ffee88', 4, 2);
      return false;
    }
    return true;
  });

  // 포탄 이동 및 충돌
  shells = shells.filter(s => {
    s.y += s.vy;
    if (Math.random() < 0.8) {
      particles.push({ x: s.x + (Math.random() - 0.5) * 4, y: s.y + s.r, vx: (Math.random() - 0.5), vy: 1 + Math.random(), life: 0.7, color: '#ff8833', size: 2 + Math.random() * 2 });
    }
    if (s.y - s.r <= 0) { explode(s.x, Math.max(s.y, s.r)); return false; }
    const hit = rectHitsBrick(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    if (hit || goblinInRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2)) { explode(s.x, s.y); return false; }
    return true;
  });

  // 망치: 포물선으로 던지고, 닿는 벽돌을 모두 관통하며 타격
  if (weapons.hammerAmmo > 0) {
    weapons.hammerCooldown--;
    if (weapons.hammerCooldown <= 0) {
      weapons.hammerCooldown = HAMMER_FIRE_INTERVAL;
      weapons.hammerAmmo--;
      const reach = Math.max(120, paddle.y - BRICK_TOP);  // 벽돌 맨 윗줄까지 닿는 높이
      hammers.push({
        x: paddle.x + paddle.w / 2,
        y: paddle.y - 12,
        r: 11,
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 2.2),
        vy: -Math.sqrt(2 * HAMMER_GRAVITY * S * reach),
        angle: 0,
        falling: false,
        hit: new Set()
      });
      playSound('throw');
    }
  }

  hammers = hammers.filter(hm => {
    hm.vy += HAMMER_GRAVITY * S;
    hm.x += hm.vx;
    hm.y += hm.vy;
    hm.angle += 0.35 * (hm.vx >= 0 ? 1 : -1);
    if (hm.x - hm.r < 0) { hm.x = hm.r; hm.vx = Math.abs(hm.vx); }
    if (hm.x + hm.r > W) { hm.x = W - hm.r; hm.vx = -Math.abs(hm.vx); }
    if (hm.y - hm.r < 0) { hm.y = hm.r; hm.vy = Math.abs(hm.vy) * 0.5; }

    // 내려오기 시작하면 같은 벽돌을 한 번 더 칠 수 있음
    if (hm.vy > 0 && !hm.falling) { hm.falling = true; hm.hit.clear(); }

    for (const b of bricks) {
      if (!b.alive || hm.hit.has(b)) continue;
      const cx = Math.max(b.x, Math.min(hm.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(hm.y, b.y + b.h));
      if (Math.hypot(hm.x - cx, hm.y - cy) <= hm.r) {
        hm.hit.add(b);
        if (b.kind === 'wall') {
          // 부서지지 않는 벽에 맞으면 망치가 튕겨 나감
          hm.vy = -hm.vy * 0.6;
          hm.vx = -hm.vx;
          spawnParticles(cx, cy, '#ffffff', 5, 2);
          playSound('wall');
        } else {
          damageBrick(b, HAMMER_DAMAGE, 'hammer');
          spawnParticles(cx, cy, '#ffcc66', 6, 3);
          shake = Math.max(shake, 3);
          playSound('hammer');
        }
      }
    }

    for (const g of goblins) {
      if (g.dead || hm.hit.has(g)) continue;
      if (hm.x + hm.r > g.x && hm.x - hm.r < g.x + g.w && hm.y + hm.r > g.y && hm.y - hm.r < g.y + g.h) {
        hm.hit.add(g);
        hurtGoblin(g, HAMMER_DAMAGE);
      }
    }

    // 떨어지는 망치를 패들로 받으면 1개 회수
    if (
      hm.vy > 0 &&
      hm.y + hm.r >= paddle.y &&
      hm.y - hm.r <= paddle.y + paddle.h &&
      hm.x >= paddle.x - 4 &&
      hm.x <= paddle.x + paddle.w + 4
    ) {
      weapons.hammerAmmo++;
      playSound('item');
      return false;
    }
    return hm.y - hm.r < canvas.height;
  });

  // 폭발 이펙트
  explosions = explosions.filter(e => {
    e.r += (e.maxR - e.r) * 0.25;
    e.life -= 0.05;
    return e.life > 0;
  });

  // 떨어지는 아이템
  items = items.filter(it => {
    it.y += it.vy;
    it.t++;
    if (
      it.y + it.h / 2 >= paddle.y &&
      it.y - it.h / 2 <= paddle.y + paddle.h &&
      it.x + it.w / 2 >= paddle.x &&
      it.x - it.w / 2 <= paddle.x + paddle.w
    ) {
      collectItem(it.type);
      return false;
    }
    return it.y - it.h / 2 < canvas.height;
  });

  if (shake > 0) { shake *= 0.85; if (shake < 0.5) shake = 0; }
}

// ===== 도깨비 모드 =====
const GOBLIN_HP = 6;            // 도깨비 기본 체력 (레벨 3마다 +1)
const GOBLIN_RESPAWN = 420;     // 쓰러진 뒤 다시 나타나기까지 (약 7초)
const GOBLIN_REPAIR_MIN = 300;  // 방망이로 벽돌 되살리는 간격 (5~8초)
const GOBLIN_REPAIR_MAX = 480;
const GOBLIN_FIRE_MIN = 240;    // 도깨비불 던지는 간격 (4~7초)
const GOBLIN_FIRE_MAX = 420;
const STUN_TIME = 60;           // 도깨비불에 맞으면 패들이 얼어붙는 시간 (약 1초)

let goblins = [], fireballs = [], beams = [], popups = [];

function rand(a, b) { return a + Math.random() * (b - a); }
function goblinSize() { return pcMode ? Math.round(30 * Math.min(1.8, S * 0.85)) : 30; }
function goblinCount() {
  const n = 1 + Math.floor((level - 1) / 2); // 2레벨마다 1마리씩 증가
  return pcMode ? Math.min(5, n + 1) : Math.min(3, n);
}

// 도깨비가 돌아다니는 구역: 벽돌 아래 ~ 화면 중간
function goblinBand(h) {
  let bottom = BRICK_TOP;
  for (const b of bricks) bottom = Math.max(bottom, b.y + b.h);
  const minY = bottom + 12;
  const maxY = Math.max(minY + 10, Math.min(canvas.height * 0.62, paddle.y - 140) - h);
  return { minY, maxY };
}

function pickTarget(g) {
  const band = goblinBand(g.h);
  g.tx = rand(0, canvas.width - g.w);
  g.ty = rand(band.minY, band.maxY);
}

function newGoblin() {
  const w = goblinSize(), h = Math.round(w * 1.15);
  const band = goblinBand(h);
  const hp = GOBLIN_HP + Math.floor(level / 3);
  const g = {
    x: rand(0, canvas.width - w), y: rand(band.minY, band.maxY), w, h,
    tx: 0, ty: 0, speed: rand(0.9, 1.6),
    hp, maxHp: hp,
    repairT: Math.floor(rand(120, GOBLIN_REPAIR_MAX)),
    fireT: Math.floor(rand(120, GOBLIN_FIRE_MAX)),
    cast: 0, flash: 0, hitCd: 0, face: 1, t: Math.random() * 100,
    spawnFx: 30, dead: false, respawn: 0
  };
  pickTarget(g);
  return g;
}

function spawnGoblins() {
  goblins = []; fireballs = []; beams = []; popups = [];
  if (gameMode !== 'goblin') return;
  for (let i = 0; i < goblinCount(); i++) goblins.push(newGoblin());
}

function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 1 }); }

function goblinInRect(x, y, w, h) {
  return goblins.find(g => !g.dead && x < g.x + g.w && x + w > g.x && y < g.y + g.h && y + h > g.y);
}

function hurtGoblin(g, dmg) {
  if (g.dead) return;
  g.hp -= dmg;
  g.flash = 8;
  score += 30;
  if (g.hp <= 0) {
    g.dead = true;
    g.cast = 0;
    g.respawn = GOBLIN_RESPAWN;
    score += 300;
    const cx = g.x + g.w / 2, cy = g.y + g.h / 2;
    spawnParticles(cx, cy, '#ff3344', 30, 7);
    spawnParticles(cx, cy, '#ffdd33', 20, 5);
    popup(cx, g.y, '+300', '#ffdd33');
    shake = Math.max(shake, 8);
    playSound('goblinDie');
    maybeDropItem(g, 0.3);
  } else {
    playSound('goblinHit');
  }
  updateHUD();
}

function canRevive(b) {
  if (b.alive || b.kind === 'wall') return false;
  // 공이 근처에 있는 자리에는 되살리지 않음
  return !(ball.x + ball.r * 2 > b.x && ball.x - ball.r * 2 < b.x + b.w &&
           ball.y + ball.r * 2 > b.y && ball.y - ball.r * 2 < b.y + b.h);
}

// 도깨비방망이 "뚝딱!" – 깨진 벽돌을 되살림 (체력 절반)
function goblinRepair(g) {
  const cands = bricks.filter(canRevive);
  if (!cands.length) return;
  const gx = g.x + g.w / 2, gy = g.y;
  cands.sort((a, b) => Math.hypot(a.x - gx, a.y - gy) - Math.hypot(b.x - gx, b.y - gy));
  const count = pcMode ? 3 : 1;
  for (let i = 0; i < count && cands.length; i++) {
    const idx = Math.floor(Math.random() * Math.min(6, cands.length));
    const b = cands.splice(idx, 1)[0];
    b.alive = true;
    b.hp = Math.max(1, Math.ceil(b.maxHp / 2));
    if (b.kind === 'regen') b.regen = 0;
    beams.push({ x1: gx + g.face * g.w * 0.4, y1: gy, x2: b.x + b.w / 2, y2: b.y + b.h / 2, life: 1 });
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ffdd33', 10, 3);
  }
  bricksDirty = true;
}

function updateGoblins() {
  popups = popups.filter(p => { p.y -= 0.6; p.life -= 0.02; return p.life > 0; });
  beams = beams.filter(bm => { bm.life -= 0.05; return bm.life > 0; });
  if (!goblins.length) return;
  const W = canvas.width;

  for (const g of goblins) {
    g.t++;
    if (g.dead) {
      if (--g.respawn <= 0) {
        Object.assign(g, newGoblin());
        popup(g.x + g.w / 2, g.y, '도깨비 등장!', '#ff6666');
        playSound('goblin');
      }
      continue;
    }
    if (g.flash > 0) g.flash--;
    if (g.hitCd > 0) g.hitCd--;
    if (g.spawnFx > 0) g.spawnFx--;

    if (g.cast > 0) {
      // 방망이를 휘두르는 중 (멈춰 있음)
      g.cast--;
      if (g.cast % 5 === 0) spawnParticles(g.x + g.w / 2 + g.face * g.w * 0.4, g.y, '#ffdd33', 2, 1.5);
      if (g.cast === 0) goblinRepair(g);
    } else {
      const mx = g.tx - g.x, my = g.ty - g.y, md = Math.hypot(mx, my);
      const sp = g.speed * S;
      if (md < sp * 2) pickTarget(g);
      else {
        g.x += mx / md * sp;
        g.y += my / md * sp;
        if (Math.abs(mx) > 1) g.face = mx > 0 ? 1 : -1;
      }

      if (--g.repairT <= 0) {
        g.repairT = Math.floor(rand(GOBLIN_REPAIR_MIN, GOBLIN_REPAIR_MAX));
        if (bricks.some(canRevive)) {
          g.cast = 40;
          popup(g.x + g.w / 2, g.y - 6, '뚝딱!', '#ffdd33');
          playSound('goblin');
        }
      }

      if (--g.fireT <= 0) {
        g.fireT = Math.floor(rand(GOBLIN_FIRE_MIN, GOBLIN_FIRE_MAX));
        const fx = g.x + g.w / 2, fy = g.y + g.h;
        const px = paddle.x + paddle.w / 2 + rand(-40, 40), py = paddle.y;
        const dd = Math.hypot(px - fx, py - fy) || 1;
        const v = 3.2 * S;
        fireballs.push({
          x: fx, y: fy,
          vx: (px - fx) / dd * v, vy: (py - fy) / dd * v,
          r: 7 * (pcMode ? Math.min(1.6, S * 0.8) : 1)
        });
        playSound('fire');
      }
    }

    // 공이 도깨비에 맞으면 튕겨 나가고 도깨비는 데미지
    const nx = Math.max(g.x, Math.min(ball.x, g.x + g.w));
    const ny = Math.max(g.y, Math.min(ball.y, g.y + g.h));
    let dx = ball.x - nx, dy = ball.y - ny, d = Math.hypot(dx, dy);
    if (d < ball.r) {
      if (d === 0) {
        dx = 0; dy = ball.dy > 0 ? -1 : 1; d = 1;
        ball.y = ball.dy > 0 ? g.y - ball.r - 1 : g.y + g.h + ball.r + 1;
      } else {
        ball.x = nx + dx / d * (ball.r + 0.5);
        ball.y = ny + dy / d * (ball.r + 0.5);
      }
      const ux = dx / d, uy = dy / d;
      const dot = ball.dx * ux + ball.dy * uy;
      if (dot < 0) { ball.dx -= 2 * dot * ux; ball.dy -= 2 * dot * uy; }
      if (Math.abs(ball.dy) < 1.5 * S) ball.dy = (ball.dy < 0 ? -1 : 1) * 1.5 * S;
      if (g.hitCd <= 0) { g.hitCd = 10; hurtGoblin(g, 1); }
    }
  }

  // 도깨비불: 패들에 맞으면 잠깐 얼어붙음
  fireballs = fireballs.filter(f => {
    f.x += f.vx;
    f.y += f.vy;
    if (Math.random() < 0.6) {
      particles.push({ x: f.x, y: f.y, vx: rand(-0.5, 0.5), vy: rand(-1, 0), life: 0.6, color: '#66aaff', size: 2 + Math.random() * 2 });
    }
    if (f.y + f.r >= paddle.y && f.y - f.r <= paddle.y + paddle.h &&
        f.x + f.r >= paddle.x && f.x - f.r <= paddle.x + paddle.w) {
      paddle.stun = STUN_TIME;
      popup(paddle.x + paddle.w / 2, paddle.y - 10, '꽁꽁!', '#88ccff');
      spawnParticles(f.x, f.y, '#88ccff', 14, 3);
      playSound('freeze');
      return false;
    }
    return f.y - f.r < canvas.height && f.x > -30 && f.x < W + 30;
  });
}

function drawGoblin(g) {
  const bob = Math.sin(g.t * 0.1) * 2;
  const u = g.w / 30;
  ctx.save();
  ctx.translate(g.x + g.w / 2, g.y + g.h / 2 + bob + 2 * u);
  ctx.scale(u, u);
  if (g.spawnFx > 0) ctx.globalAlpha = 1 - g.spawnFx / 30;

  // 호피 무늬 바지
  ctx.shadowColor = g.flash > 0 ? '#ffffff' : '#ff3355';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#f5b400';
  ctx.beginPath();
  ctx.roundRect(-9, 4, 18, 9, 3);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#3a2a00';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  [-6, -1, 4].forEach(i => { ctx.moveTo(i, 5); ctx.lineTo(i + 2, 12); });
  ctx.stroke();

  // 얼굴 / 몸
  ctx.shadowColor = g.flash > 0 ? '#ffffff' : '#ff3355';
  ctx.shadowBlur = 12;
  ctx.fillStyle = g.flash > 0 ? '#ffffff' : '#e8413a';
  ctx.beginPath();
  ctx.ellipse(0, -4, 12, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 뿔
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath();
  ctx.moveTo(-8, -12); ctx.lineTo(-5, -22); ctx.lineTo(-2, -14);
  ctx.moveTo(8, -12); ctx.lineTo(5, -22); ctx.lineTo(2, -14);
  ctx.fill();

  // 눈 + 눈썹
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-4.5, -6, 3.2, 0, Math.PI * 2);
  ctx.arc(4.5, -6, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(-4.5 + g.face, -5.5, 1.6, 0, Math.PI * 2);
  ctx.arc(4.5 + g.face, -5.5, 1.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4a0000';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-8, -11); ctx.lineTo(-2, -9);
  ctx.moveTo(8, -11); ctx.lineTo(2, -9);
  ctx.stroke();

  // 입 + 송곳니
  ctx.fillStyle = '#5a0000';
  ctx.beginPath();
  ctx.ellipse(0, 1, 5.5, 2.8, 0, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-3.5, 1); ctx.lineTo(-2.5, 3.6); ctx.lineTo(-1.5, 1);
  ctx.moveTo(1.5, 1); ctx.lineTo(2.5, 3.6); ctx.lineTo(3.5, 1);
  ctx.fill();

  // 도깨비방망이
  const swing = g.cast > 0 ? (-1.3 + (40 - g.cast) / 40 * 2.4) : (-0.5 + Math.sin(g.t * 0.05) * 0.15);
  ctx.save();
  ctx.translate(12 * g.face, 3);
  ctx.rotate(swing * g.face);
  if (g.cast > 0) { ctx.shadowColor = '#ffdd33'; ctx.shadowBlur = 14; }
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.roundRect(-1.5, -7, 3, 9, 1);
  ctx.fill();
  ctx.fillStyle = '#a86a32';
  ctx.beginPath();
  ctx.roundRect(-3.5, -19, 7, 13, 3);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#e8e8e8';
  [[0, -16], [-1.5, -11.5], [1.5, -11.5]].forEach(([px, py]) => {
    ctx.beginPath();
    ctx.arc(px, py, 1, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
  ctx.restore();

  // 체력바
  if (g.hp < g.maxHp) {
    const by = g.y - 8 + bob;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(g.x, by, g.w, 4);
    ctx.fillStyle = '#ff4455';
    ctx.fillRect(g.x, by, g.w * Math.max(0, g.hp / g.maxHp), 4);
  }
}

function drawGoblins() {
  beams.forEach(bm => {
    ctx.save();
    ctx.globalAlpha = bm.life;
    ctx.strokeStyle = '#ffdd33';
    ctx.shadowColor = '#ffdd33';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(bm.x1, bm.y1);
    ctx.lineTo(bm.x2, bm.y2);
    ctx.stroke();
    ctx.restore();
  });
  goblins.forEach(g => { if (!g.dead) drawGoblin(g); });
  fireballs.forEach(f => {
    ctx.save();
    const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.7);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.4, '#66aaff');
    gr.addColorStop(1, 'rgba(40,80,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 1.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPopups() {
  popups.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = `bold ${Math.round(15 * Math.max(1, S * 0.8))}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  });
}

function drawGlowRect(x, y, w, h, color, glow) {
  ctx.save();
  ctx.shadowColor = glow;
  ctx.shadowBlur = 15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.restore();
}

function drawBrick(brick, c = ctx) {
  const [main, light, dark] = brick.color;
  const { x, y, w, h } = brick;

  if (brick.kind === 'wall') {
    // 부서지지 않는 벽: 어두운 금속 + 빗금
    c.save();
    const g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, light);
    g.addColorStop(1, dark);
    c.fillStyle = g;
    c.beginPath();
    c.roundRect(x, y, w, h, 2);
    c.fill();
    c.clip();
    c.strokeStyle = 'rgba(0,0,0,0.35)';
    c.lineWidth = 2;
    c.beginPath();
    for (let i = -h; i < w; i += 7) {
      c.moveTo(x + i, y + h);
      c.lineTo(x + i + h, y);
    }
    c.stroke();
    c.restore();
    c.save();
    c.strokeStyle = '#8a90a0';
    c.lineWidth = 1;
    c.beginPath();
    c.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 2);
    c.stroke();
    c.restore();
    return;
  }

  const ratio = brick.hp / brick.maxHp;
  c.save();
  c.shadowColor = main;
  if (brick.kind === 'steel') c.shadowBlur = 6;
  else if (brick.kind === 'regen') c.shadowBlur = 12;
  else c.shadowBlur = 10 * ratio;

  const gradient = c.createLinearGradient(x, y, x, y + h);
  gradient.addColorStop(0, light);
  gradient.addColorStop(0.5, main);
  gradient.addColorStop(1, dark);
  c.fillStyle = gradient;
  c.globalAlpha = brick.kind === 'normal' ? 0.4 + 0.6 * ratio : 1;
  c.beginPath();
  c.roundRect(x, y, w, h, 3);
  c.fill();
  c.shadowBlur = 0;
  c.globalAlpha = 1;

  if (brick.kind === 'steel') {
    // 리벳
    c.fillStyle = '#5a6470';
    const rr = Math.max(1.2, h * 0.1);
    [[x + 3, y + 3], [x + w - 3, y + 3], [x + 3, y + h - 3], [x + w - 3, y + h - 3]].forEach(([px, py]) => {
      c.beginPath();
      c.arc(px, py, rr, 0, Math.PI * 2);
      c.fill();
    });
    // 체력이 줄수록 금이 늘어남
    const cracks = Math.floor((1 - ratio) * 4);
    c.strokeStyle = 'rgba(20,20,30,0.7)';
    c.lineWidth = 1;
    for (let i = 0; i < cracks; i++) {
      const c0 = x + w * (0.15 + 0.22 * i);
      c.beginPath();
      c.moveTo(c0, y);
      c.lineTo(c0 + w * 0.08, y + h * 0.45);
      c.lineTo(c0 - w * 0.04, y + h * 0.7);
      c.lineTo(c0 + w * 0.05, y + h);
      c.stroke();
    }
  } else if (brick.kind === 'regen') {
    c.strokeStyle = 'rgba(200,255,220,0.85)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.roundRect(x + 1, y + 1, w - 2, h - 2, 3);
    c.stroke();
  }

  if (brick.hp > 1) {
    c.fillStyle = brick.kind === 'steel' ? 'rgba(20,25,35,0.85)' : 'rgba(255,255,255,0.8)';
    c.font = `bold ${Math.max(9, h * 0.65)}px Arial`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(brick.hp, x + w / 2, y + h / 2 + 0.5);
  }
  c.restore();
}

function drawPaddle() {
  // 기관총 총신 (패들 양 끝)
  if (weapons.gunTime > 0) {
    const blink = weapons.gunTime < 120 && Math.floor(weapons.gunTime / 8) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.4 : 1;
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(paddle.x + 3, paddle.y - 9, 6, 11);
    ctx.fillRect(paddle.x + paddle.w - 9, paddle.y - 9, 6, 11);
    ctx.fillStyle = '#ffccd5';
    ctx.fillRect(paddle.x + 4.5, paddle.y - 11, 3, 3);
    ctx.fillRect(paddle.x + paddle.w - 7.5, paddle.y - 11, 3, 3);
    ctx.restore();
  }
  // 대포 포신 (패들 중앙)
  if (weapons.cannonAmmo > 0) {
    const cx = paddle.x + paddle.w / 2;
    const recoil = weapons.cannonCooldown > CANNON_FIRE_INTERVAL - 6 ? 4 : 0;
    ctx.save();
    ctx.shadowColor = '#9955ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#6633cc';
    ctx.beginPath();
    ctx.arc(cx, paddle.y, 10, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#9955ff';
    ctx.beginPath();
    ctx.roundRect(cx - 5, paddle.y - 20 + recoil, 10, 16, 2);
    ctx.fill();
    ctx.restore();
  }

  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
  const frozen = paddle.stun > 0;
  const pcol = frozen ? '#5577ff' : '#00ffff';
  grad.addColorStop(0, pcol);
  grad.addColorStop(0.5, frozen ? '#ccddff' : '#ffffff');
  grad.addColorStop(1, pcol);
  ctx.save();
  if (frozen && Math.floor(paddle.stun / 5) % 2 === 0) ctx.globalAlpha = 0.6;
  ctx.shadowColor = pcol;
  ctx.shadowBlur = 20;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
  ctx.restore();
}

function drawBall() {
  // Trail
  ball.trail.forEach((t, i) => {
    const alpha = (i / ball.trail.length) * 0.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * (i / ball.trail.length), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  ctx.save();
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 25;
  const grad = ctx.createRadialGradient(
    ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.1,
    ball.x, ball.y, ball.r
  );
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.5, '#88ddff');
  grad.addColorStop(1, '#00aaff');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, p.size * p.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawItems() {
  items.forEach(it => {
    const info = ITEM_TYPES[it.type];
    const pulse = 0.7 + 0.3 * Math.sin(it.t * 0.2);
    ctx.save();
    ctx.shadowColor = info.main;
    ctx.shadowBlur = 15 * pulse;
    const g = ctx.createLinearGradient(0, it.y - it.h / 2, 0, it.y + it.h / 2);
    g.addColorStop(0, info.light);
    g.addColorStop(1, info.main);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(it.x - it.w / 2, it.y - it.h / 2, it.w, it.h, it.h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(info.label, it.x, it.y + 1);
    ctx.restore();
  });
}

// 망치 모양 그리기 (x, y 중심 / angle 회전)
function drawHammerShape(x, y, angle, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.shadowColor = '#ffaa33';
  ctx.shadowBlur = 10;
  // 손잡이
  ctx.fillStyle = '#b5652b';
  ctx.beginPath();
  ctx.roundRect(-2, -3, 4, 16, 2);
  ctx.fill();
  // 머리
  const g = ctx.createLinearGradient(0, -11, 0, -2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#8899aa');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(-9, -11, 18, 9, 2);
  ctx.fill();
  ctx.restore();
}

function drawProjectiles() {
  // 총알
  ctx.save();
  ctx.shadowColor = '#ffee55';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#fff6aa';
  bullets.forEach(bl => ctx.fillRect(bl.x, bl.y, bl.w, bl.h));
  ctx.restore();

  // 포탄
  shells.forEach(s => {
    ctx.save();
    ctx.shadowColor = '#ff8800';
    ctx.shadowBlur = 18;
    const g = ctx.createRadialGradient(s.x - 2, s.y - 2, 1, s.x, s.y, s.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, '#ffbb55');
    g.addColorStop(1, '#cc3300');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 망치
  hammers.forEach(hm => drawHammerShape(hm.x, hm.y, hm.angle));

  // 폭발
  explosions.forEach(e => {
    ctx.save();
    ctx.globalAlpha = e.life * 0.5;
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    g.addColorStop(0, '#ffffcc');
    g.addColorStop(0.5, '#ff9933');
    g.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = e.life;
    ctx.strokeStyle = '#ffcc66';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

// 캔버스 상단에 무기 상태 표시
function drawWeaponStatus() {
  let x = 8;
  const y = 19;
  ctx.save();
  ctx.font = 'bold 12px Arial';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  if (weapons.gunTime > 0) {
    ctx.fillStyle = '#ff5577';
    ctx.fillText('기관총', x, y);
    const barX = x + 42, barW = 56;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(barX, y - 5, barW, 10);
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(barX, y - 5, barW * Math.min(1, weapons.gunTime / GUN_MAX_DURATION), 10);
    x = barX + barW + 12;
  }
  if (weapons.cannonAmmo > 0) {
    ctx.fillStyle = '#bb88ff';
    ctx.fillText('대포', x, y);
    const shown = Math.min(weapons.cannonAmmo, 5);
    for (let i = 0; i < shown; i++) {
      ctx.beginPath();
      ctx.arc(x + 32 + i * 11, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    x += 32 + shown * 11;
    if (weapons.cannonAmmo > 5) {
      ctx.fillText(`+${weapons.cannonAmmo - 5}`, x - 2, y);
      x += 22;
    }
    x += 8;
  }
  if (weapons.hammerAmmo > 0) {
    drawHammerShape(x + 8, y + 1, -0.6, 0.8);
    ctx.fillStyle = '#ffaa33';
    ctx.fillText(`x${weapons.hammerAmmo}`, x + 20, y);
  }
  ctx.restore();
}

function update() {
  const W = canvas.width, H = canvas.height;

  // 키보드 / TV 리모컨 방향키로 패들 이동
  const kdir = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
  if (paddle.stun > 0) paddle.stun--;
  if (kdir && paddle.stun <= 0) paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + kdir * Math.max(8, W * 0.012)));

  // Ball trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 10) ball.trail.shift();

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall collisions
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); playSound('wall'); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); playSound('wall'); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); playSound('wall'); }

  // Ball fell
  if (ball.y + ball.r > H + 20) {
    playSound('die');
    lives--;
    updateHUD();
    if (lives <= 0) {
      gameOver();
      return;
    }
    ball.x = W / 2;
    ball.y = H - 70;
    ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.5) * S;
    ball.dy = -(3 + level * 0.5) * S;
    ball.trail = [];
    resetWeapons(); // 목숨을 잃으면 무기도 사라짐
    fireballs = [];
    paddle.stun = 0;
  }

  // Paddle collision
  if (
    ball.y + ball.r >= paddle.y &&
    ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.dy) &&
    ball.x >= paddle.x - ball.r &&
    ball.x <= paddle.x + paddle.w + ball.r &&
    ball.dy > 0
  ) {
    const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    ball.dx = hitPos * (5 + level * 0.4) * S;
    // 패들 정중앙에 맞아도 수직으로만 오가지 않도록 최소 가로 속도 보장
    if (Math.abs(ball.dx) < 0.8 * S) ball.dx = (ball.dx < 0 || (ball.dx === 0 && Math.random() < 0.5) ? -0.8 : 0.8) * S;
    ball.dy = -Math.abs(ball.dy);
    ball.y = paddle.y - ball.r;
    playSound('paddle');
  }

  // Brick collisions (ball)
  for (let b of bricks) {
    if (!b.alive) continue;
    if (
      ball.x + ball.r > b.x &&
      ball.x - ball.r < b.x + b.w &&
      ball.y + ball.r > b.y &&
      ball.y - ball.r < b.y + b.h
    ) {
      const overlapLeft = ball.x + ball.r - b.x;
      const overlapRight = b.x + b.w - (ball.x - ball.r);
      const overlapTop = ball.y + ball.r - b.y;
      const overlapBottom = b.y + b.h - (ball.y - ball.r);
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.dx *= -1;
      else ball.dy *= -1;

      const hurt = damageBrick(b, 1, 'ball');
      playSound(!hurt ? 'wall' : b.kind === 'steel' ? 'hammer' : 'brick');
      break;
    }
  }

  if (itemCooldown > 0) itemCooldown--;

  // 재생 벽돌: 한동안 안 맞으면 체력 1씩 회복
  for (const b of bricks) {
    if (b.alive && b.kind === 'regen' && b.hp < b.maxHp) {
      b.regen++;
      if (b.regen >= REGEN_INTERVAL) {
        b.regen = 0;
        b.hp++;
        bricksDirty = true;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#66ffaa', 5, 1.5);
      }
    }
  }

  // 무기 / 아이템
  updateWeapons();

  // 도깨비
  updateGoblins();

  // 모든 벽돌 파괴 시 다음 레벨 (총알·포탄으로 깨도 적용)
  if (bricks.every(b => !b.alive || b.kind === 'wall')) {
    nextLevel();
  }

  // Particles
  particles = particles.filter(p => p.life > 0.01);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.03;
    p.vx *= 0.97;
  });
}

function drawBackground() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
  
  // Stars
  for (let i = 0; i < 30; i++) {
    const x = (i * 137.5 + 50) % canvas.width;
    const y = (i * 97.3 + 30) % canvas.height;
    const alpha = 0.1 + 0.1 * Math.sin(Date.now() * 0.001 + i);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// 벽돌은 별도 캔버스에 그려두고 매 프레임 한 장으로 복사 (벽돌이 많아도 빠르게)
const brickLayer = document.createElement('canvas');
const brickCtx = brickLayer.getContext('2d');
let bricksDirty = true;

function drawBricksLayer() {
  if (brickLayer.width !== canvas.width || brickLayer.height !== canvas.height) {
    brickLayer.width = canvas.width;
    brickLayer.height = canvas.height;
    bricksDirty = true;
  }
  if (bricksDirty) {
    brickCtx.clearRect(0, 0, brickLayer.width, brickLayer.height);
    bricks.forEach(b => { if (b.alive) drawBrick(b, brickCtx); });
    bricksDirty = false;
  }
  ctx.drawImage(brickLayer, 0, 0);
}

// 게임 로직은 항상 초당 60번 실행 (모니터 주사율·렌더링 속도와 무관)
const STEP = 1000 / 60;
let lastTime = 0, accumulator = 0;

function gameLoop(now) {
  if (!gameRunning) return;
  if (now === undefined) now = performance.now();
  if (!lastTime) lastTime = now;
  accumulator += Math.min(100, now - lastTime);
  lastTime = now;

  let steps = 0;
  while (accumulator >= STEP && steps < 6) {
    update();
    if (!gameRunning) return;
    accumulator -= STEP;
    steps++;
  }
  if (steps >= 6) accumulator = 0;

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();
  drawBricksLayer();
  drawGoblins();
  drawItems();
  drawProjectiles();
  drawPaddle();
  drawBall();
  drawParticles();
  drawPopups();
  ctx.restore();

  drawWeaponStatus();
  drawBanner();
  animId = requestAnimationFrame(gameLoop);
}

let starting = false;
async function startGame() {
  if (gameRunning || starting) return;
  starting = true;
  try {
    // 컴퓨터 / TV 모드는 전체 화면으로 전환
    if (pcMode && !document.fullscreenElement && document.documentElement.requestFullscreen) {
      try {
        await document.documentElement.requestFullscreen();
        await new Promise(r => setTimeout(r, 200));
      } catch (e) {}
    }
    setCanvasSize();
    overlay.style.display = 'none';
    gameRunning = true;
    initGame();
    lastTime = 0;
    accumulator = STEP;
    gameLoop();
  } finally {
    starting = false;
  }
}

async function gameOver() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  playSound('gameover');

  // Save score
  try {
    await db.collection("apps/app-mufb6frx/items").add({
      score: score,
      level: level,
      mode: gameMode,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {}

  finalScore.style.display = 'block';
  finalScore.textContent = `점수: ${score}`;
  bestScoreText.style.display = 'block';
  bestScoreText.textContent = `도달 레벨: ${level}`;
  startBtn.textContent = '다시 시작';
  overlay.style.display = 'flex';
}

// Touch controls
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  paddleStartX = paddle ? paddle.x : 0;
  if (!gameRunning) return;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!gameRunning || !paddle) return;
  if (paddle.stun > 0) { touchStartX = e.touches[0].clientX; paddleStartX = paddle.x; return; }
  const dx = e.touches[0].clientX - touchStartX;
  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddleStartX + dx));
}, { passive: false });

// Mouse controls
canvas.addEventListener('mousemove', e => {
  if (!gameRunning || !paddle || paddle.stun > 0) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mx - paddle.w / 2));
});

startBtn.addEventListener('click', startGame);

// 키보드 / TV 리모컨
const keys = {};
const MOVE_KEYS = ['arrowleft', 'arrowright', 'a', 'd'];
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS.includes(k)) { keys[k] = true; e.preventDefault(); }
  if ((k === ' ' || k === 'enter') && !gameRunning) { e.preventDefault(); startGame(); }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS.includes(k)) keys[k] = false;
});

// 화면 모드 전환
function applyModeLayout() {
  pcMode = isWideScreen();
  document.body.classList.toggle('pc-mode', pcMode);
  if (pcMode) overlay.appendChild(leaderboardEl);          // 넓은 화면에서는 랭킹을 시작 화면에 표시
  else gameContainer.insertBefore(leaderboardEl, controlsEl);
  controlsEl.textContent = pcMode
    ? '⌨ ←/→ 키, A/D 또는 마우스로 패들 이동 · Space/Enter로 시작 · 떨어지는 아이템을 패들로 받으세요'
    : '📱 좌우로 스와이프하여 패들 이동 · 떨어지는 아이템을 패들로 받으세요';
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === gameMode);
  });
  setCanvasSize();
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (gameRunning) return;
    gameMode = btn.dataset.mode;
    try { localStorage.setItem('brickMode', gameMode); } catch (e) {}
    pcMode = isWideScreen();
    if (!pcMode && document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
    applyModeLayout();
    drawInitial();
  });
});

const MODE_ICON = { wide: '🖥 ', goblin: '👹 ' };

// Load leaderboard
function loadLeaderboard() {
  db.collection("apps/app-mufb6frx/items")
    .orderBy("score", "desc")
    .limit(10)
    .onSnapshot(snap => {
      rankList.innerHTML = '';
      // QuerySnapshot.forEach는 인덱스를 넘겨주지 않으므로 snap.docs 사용
      snap.docs.forEach((doc, i) => {
        const d = doc.data();
        const li = document.createElement('li');
        const medals = ['🥇','🥈','🥉'];
        const rankIcon = medals[i] || `${i+1}.`;
        li.innerHTML = `<span class="rank-num">${rankIcon}</span><span>${MODE_ICON[d.mode] || ''}Lv.${Number(d.level) || 1}</span><span class="rank-score">${Number(d.score) || 0}점</span>`;
        rankList.appendChild(li);
      });
    });
}

// Initial draw
function drawInitial() {
  drawBackground();
  buildBricks(1).forEach(b => drawBrick(b));
}
applyModeLayout();
drawInitial();
loadLeaderboard();

window.addEventListener('resize', () => {
  const oldW = canvas.width, oldH = canvas.height;
  setCanvasSize();
  if (!gameRunning) { drawInitial(); return; }
  // 게임 중 화면 크기가 바뀌면 비율에 맞춰 위치 조정
  const sx = canvas.width / oldW, sy = canvas.height / oldH;
  if (sx === 1 && sy === 1) return;
  bricks.forEach(b => { b.x *= sx; b.w *= sx; b.y *= sy; b.h *= sy; });
  bricksDirty = true;
  paddle.w *= sx;
  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x * sx));
  paddle.y = canvas.height - 50;
  ball.x *= sx;
  ball.y *= sy;
  ball.trail = [];
  items = []; bullets = []; shells = []; hammers = [];
});
</script>
